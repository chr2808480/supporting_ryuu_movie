<div style="display:none;max-height:0;max-width:0;overflow:hidden;opacity:0;font-size:1px;line-height:1px;color:#f7eaec;mso-hide:all;">{{message}}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f7eaec" style="background-color:#f7eaec;">
  <tr>
    <td align="center" style="padding:24px 12px;">

      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#fffbfb" style="max-width:600px;background-color:#fffbfb;border:1px solid #e9d6d9;border-radius:14px;overflow:hidden;">
        <tr>
          <td bgcolor="#1c1a20" style="background-color:#1c1a20;padding:18px 24px;font-family:'Hiragino Kaku Gothic ProN','Hiragino Sans','Noto Sans JP','Yu Gothic',Meiryo,sans-serif;">
            <span style="color:#ff4d5e;font-size:20px;line-height:1.4;">&#9733;</span>
            <span style="color:#f7eaec;font-size:17px;line-height:1.4;font-weight:bold;letter-spacing:.04em;">ryuu星軍 本部</span><br>
            <span style="color:#e1c1c6;font-size:12px;line-height:1.6;">お問い合わせフォームに新しいメッセージが届きました</span>
          </td>
        </tr>
        <tr>
          <td bgcolor="#ff4d5e" style="background-color:#ff4d5e;height:4px;font-size:0;line-height:0;">&nbsp;</td>
        </tr>
        <tr>
          <td style="padding:24px;font-family:'Hiragino Kaku Gothic ProN','Hiragino Sans','Noto Sans JP','Yu Gothic',Meiryo,sans-serif;color:#1c1a20;">

            <p style="margin:0 0 4px;font-size:12px;line-height:1.6;font-weight:bold;letter-spacing:.06em;color:#c4283a;">&#9733; お問い合わせの種類</p>
            <p style="margin:0 0 20px;font-size:20px;line-height:1.5;font-weight:bold;color:#1c1a20;">{{title}}</p>

            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 24px;border-top:1px solid #eadcdf;">
              <tr>
                <td style="padding:10px 0;border-bottom:1px solid #eadcdf;">
                  <p style="margin:0;font-size:12px;line-height:1.6;color:#6b5f63;">お名前・ハンドル名</p>
                  <p style="margin:0;font-size:16px;line-height:1.6;color:#1c1a20;">{{name}}</p>
                </td>
              </tr>
              <tr>
                <td style="padding:10px 0;border-bottom:1px solid #eadcdf;">
                  <p style="margin:0;font-size:12px;line-height:1.6;color:#6b5f63;">返信先メールアドレス</p>
                  <p style="margin:0;font-size:16px;line-height:1.6;color:#1c1a20;word-break:break-all;">{{email}}</p>
                </td>
              </tr>
            </table>

            <p style="margin:0 0 6px;font-size:12px;line-height:1.6;font-weight:bold;letter-spacing:.06em;color:#c4283a;">&#9733; 内容</p>
            <div style="margin:0 0 24px;padding:16px 18px;background-color:#fbf3f4;border-left:4px solid #ff4d5e;border-radius:0 10px 10px 0;font-size:16px;line-height:1.8;color:#1c1a20;white-space:pre-wrap;word-break:break-word;">{{message}}</div>

            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f7eaec" style="background-color:#f7eaec;border-radius:10px;">
              <tr>
                <td style="padding:12px 16px;font-size:12px;line-height:1.7;color:#6b5f63;">
                  <strong style="color:#1c1a20;">返信のしかた</strong>：返信先メールアドレスが書かれていれば、このメールに「返信」するとそのまま送信者に届きます。空欄の項目は、送信者が記入しなかったものです（返信先が空欄なら返信できません）。
                </td>
              </tr>
            </table>

          </td>
        </tr>
      </table>

      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;">
        <tr>
          <td align="center" style="padding:16px 12px 0;font-family:'Hiragino Kaku Gothic ProN','Hiragino Sans','Noto Sans JP','Yu Gothic',Meiryo,sans-serif;">
            <p style="margin:0 0 4px;font-size:12px;line-height:1.6;font-weight:bold;letter-spacing:.2em;color:#c4283a;">&#9733; #ryuu星軍 &#9733;</p>
            <p style="margin:0;font-size:11px;line-height:1.7;color:#6b5f63;">ryuu星軍 本部（RyuU 非公式ファンクラブ）のお問い合わせフォームから自動で送られたメールです。</p>
          </td>
        </tr>
      </table>

    </td>
  </tr>
</table>
